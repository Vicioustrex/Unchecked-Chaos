        <style>
            @keyframes fadeIn {
                from {
                    opacity: 0%;
                    top: -100%;
                }
                to {
                    opacity: 100%;
                    top: 15%;
                }
            }
            
            @keyframes fadeUp {
                from {
                    opacity: 0%;
                    top: 100%;
                }
                to {
                    opacity: 100%;
                    top: 15%;
                }
            }

    <style>
      #popup {
        z-index: 999999;
        width: 70%;
        height: 70%;

        top: 15%;
        left: 15%;
        backdrop-filter: blur(10px);
        padding: 2%;
        font-size: 200%;
        color: white;
        background: rgba(0, 0, 0, 0.15);

        cursor: auto;
                animation: fadeUp 1s 1;

      }
      #no {
        position: absolute;

        cursor: pointer;
      }
      #yes {

        font-size: 110%;
        cursor: pointer;
      }
